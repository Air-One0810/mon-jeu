<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Proto V2 — Combat avec États</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .game { display: flex; flex-direction: column; gap: 14px; }

    .zone-label {
      font-size: 11px; font-weight: 500; color: #888;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
    }

    .synergies-banner {
      background: #2a2a2a; border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: #aaa; line-height: 1.7;
    }
    .synergies-banner b { color: #fff; font-weight: 500; }
    .synergies-banner .arrow { color: #9b87d4; }

    .enemies-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .enemy-card {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 10px 14px; min-width: 130px; flex: 1; position: relative;
    }
    .enemy-card.dead { opacity: 0.35; }
    .enemy-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .enemy-atk { font-size: 12px; color: #aaa; margin-bottom: 6px; }
    .hp-bar-wrap { background: #1a1a1a; border-radius: 99px; height: 6px; overflow: hidden; }
    .hp-bar { height: 6px; border-radius: 99px; background: #D85A30; transition: width 0.3s; }
    .hp-text { font-size: 12px; color: #aaa; margin-top: 3px; }
    .states-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 20px; }
    .state-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 500;
    }
    .state-givre { background: #1e3a5f; color: #8bb8e8; }
    .state-brule { background: #5a2a1c; color: #f5a383; }
    .state-frag  { background: #3d2f5e; color: #b29be0; }
    .state-stun  { background: #3a3a3a; color: #ccc; }

    .stats-row { display: flex; gap: 10px; }
    .stat-box {
      background: #2a2a2a; border-radius: 8px; padding: 8px 14px;
      flex: 1; text-align: center;
    }
    .stat-val { font-size: 20px; font-weight: 500; }
    .stat-lbl { font-size: 11px; color: #aaa; margin-top: 1px; }

    .hand-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .card {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 8px 10px; cursor: pointer; min-width: 95px; flex: 1;
      transition: border-color 0.15s, transform 0.1s; user-select: none;
    }
    .card:hover { border-color: #555; transform: translateY(-2px); }
    .card.element { border-top: 2px solid #1D9E75; }
    .card.forme { border-top: 2px solid #7F77DD; }
    .card.selected.element { border: 2px solid #1D9E75; background: #1f3a30; }
    .card.selected.forme { border: 2px solid #7F77DD; background: #2c2845; }
    .card-type { font-size: 10px; font-weight: 500; color: #888; margin-bottom: 2px; }
    .card-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .card-cost { font-size: 11px; color: #aaa; }
    .card-effect { font-size: 11px; color: #aaa; margin-top: 2px; line-height: 1.4; }

    .assembly-zone {
      background: #2a2a2a; border: 1px dashed #555; border-radius: 8px;
      padding: 12px; min-height: 64px; display: flex; align-items: center; gap: 10px;
    }
    .assembly-preview { font-size: 13px; color: #aaa; flex: 1; line-height: 1.5; }
    .assembly-bonus { color: #5dd4a3; font-weight: 500; }

    .btn {
      background: transparent; border: 1px solid #555; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 500; color: #e8e8e8;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #2a2a2a; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: #1D9E75; color: white; border-color: #1D9E75; }
    .btn-primary:hover { background: #0F6E56; }
    .btn-danger { background: #D85A30; color: white; border-color: #D85A30; }
    .btn-danger:hover { background: #993C1D; }

    .target-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .target-btn {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 4px 10px; font-size: 12px; cursor: pointer; color: #e8e8e8;
    }
    .target-btn:hover { border-color: #378ADD; }
    .target-btn.selected { background: #1e3a5f; border: 1px solid #378ADD; color: #8bb8e8; }

    .log {
      background: #2a2a2a; border-radius: 8px; padding: 10px 14px;
      max-height: 140px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 3px;
    }
    .log-entry { font-size: 12px; color: #aaa; line-height: 1.5; }
    .log-entry.good { color: #5dd4a3; font-weight: 500; }
    .log-entry.bad { color: #f5a383; font-weight: 500; }
    .log-entry.info { color: #8bb8e8; font-weight: 500; }
    .log-entry.combo { color: #b29be0; font-weight: 500; }
    .log-entry.warn { color: #e8c97a; }

    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .modal-bg {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center; z-index: 20;
    }
    .modal {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 12px;
      padding: 24px; text-align: center; max-width: 320px;
    }
    .modal h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: #aaa; margin-bottom: 16px; line-height: 1.5; }

    .divider { border: none; border-top: 1px solid #3a3a3a; }

    .reward-card {
      background: #252525;
      border: 2px solid #555;
      border-radius: 12px;
      padding: 16px;
      width: 180px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s, border-color 0.15s;
    }
    .reward-card:hover {
      transform: translateY(-4px);
      border-color: #888;
    }
    .reward-card.rarity-common { border-color: #888; }
    .reward-card.rarity-rare   { border-color: #378ADD; box-shadow: 0 0 12px rgba(55,138,221,0.3); }
    .reward-card.rarity-epic   { border-color: #b29be0; box-shadow: 0 0 16px rgba(178,155,224,0.4); }
    .rarity-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .rarity-common .rarity-label { color: #888; }
    .rarity-rare   .rarity-label { color: #378ADD; }
    .rarity-epic   .rarity-label { color: #b29be0; }

    .card.consumable { border-top: 2px solid #d4a23d; }
    .card.selected.consumable { border: 2px solid #d4a23d; background: #3d2f1c; }

    /* Bannière Cataclysme active */
    .combo-bonus-banner {
      background: #3d2845; border-radius: 8px; padding: 6px 12px;
      font-size: 12px; color: #b29be0; font-weight: 500;
    }
  </style>
</head>
<body>

<div class="game" id="app"></div>

<script>
// ============================================================
// ZONE 1 — DONNÉES STATIQUES
// ============================================================

const DEV = {
  godMode: false,
  startCombat: 0,
  showHiddenInfo: false,
};

// ============================================================
// MÉTA-PROGRESSION
// ============================================================
const META_STORAGE_KEY = 'mon-jeu:meta:v1';

const DEFAULT_META = {
  fragments: 0,
  unlockedCards: [],
  totalRunsWon: 0,
  totalRunsLost: 0,
};

function loadMeta() {
  try {
    const stored = localStorage.getItem(META_STORAGE_KEY);
    if (!stored) return { ...DEFAULT_META };
    const parsed = JSON.parse(stored);
    return { ...DEFAULT_META, ...parsed };
  } catch (e) {
    console.warn('Erreur de chargement méta, reset.', e);
    return { ...DEFAULT_META };
  }
}

function saveMeta() {
  try {
    localStorage.setItem(META_STORAGE_KEY, JSON.stringify(G.meta));
  } catch (e) {
    console.error('Erreur de sauvegarde méta.', e);
  }
}

function resetMeta() {
  localStorage.removeItem(META_STORAGE_KEY);
  G.meta = { ...DEFAULT_META };
}

// Deck de départ — inchangé
const CARDS_DEF = [
  { id:'feu1',  type:'element', name:'Feu',        cost:2, effect:'3 dgt + Brûlure (2)',     elem:'feu' },
  { id:'feu2',  type:'element', name:'Feu',        cost:2, effect:'3 dgt + Brûlure (2)',     elem:'feu' },
  { id:'gla1',  type:'element', name:'Glace',      cost:2, effect:'1 dgt + Givré (1 tour)',  elem:'glace' },
  { id:'gla2',  type:'element', name:'Glace',      cost:2, effect:'1 dgt + Givré (1 tour)',  elem:'glace' },
  { id:'vid1',  type:'element', name:'Vide',       cost:2, effect:'2 dgt + Fragile + pioche',elem:'vide' },
  { id:'vid2',  type:'element', name:'Vide',       cost:2, effect:'2 dgt + Fragile + pioche',elem:'vide' },
  { id:'pro1',  type:'forme',   name:'Projectile', cost:1, effect:'1 ennemi ciblé',          forme:'proj' },
  { id:'pro2',  type:'forme',   name:'Projectile', cost:1, effect:'1 ennemi ciblé',          forme:'proj' },
  { id:'zon1',  type:'forme',   name:'Zone',       cost:3, effect:'Tous les ennemis',        forme:'zone' },
  { id:'zon2',  type:'forme',   name:'Zone',       cost:3, effect:'Tous les ennemis',        forme:'zone' },
  { id:'arm1',  type:'forme',   name:'Armure',     cost:1, effect:'+4 bouclier',             forme:'arm' },
  { id:'arm2',  type:'forme',   name:'Armure',     cost:1, effect:'+4 bouclier',             forme:'arm' },
];

// ============================================================
// REWARD_POOL — V1 refondu
// Supprimés : Brûlure intense, Glace persistante, Vide instable,
//             Régénération, Sceau vital.
// Ajoutés   : 4 Hybrides + 5 Tempo.
// Commons ancres : Feu+, Projectile+, Armure runique, Étincelle.
// ============================================================
const REWARD_POOL = [

  // ── COMMONS ANCRES ──────────────────────────────────────────────────────
  // Rôle : lisibilité immédiate, baseline mémorable.
  { id:'feuP_1',          type:'element', name:'Feu+',
    cost:2,  effect:'4 dgt + Brûlure (2). Ancre dégâts.',
    elem:'feu', rarity:'common', dmgOverride:4 },

  { id:'projP_1',         type:'forme',   name:'Projectile+',
    cost:0,  effect:'1 ennemi ciblé (gratuit). Ancre mana.',
    forme:'proj', rarity:'common' },

  { id:'armureRunique_1', type:'forme',   name:'Armure runique',
    cost:1,  effect:'+6 bouclier. Ancre défense.',
    forme:'arm', rarity:'common', shieldAmount:6 },

  // Étincelle — ancre tempo / introduction du mot-clé Élan
  { id:'etincelle_1',     type:'forme',   name:'Étincelle',
    cost:1,  effect:'2 dgt bonus + Élan (+1 action et +1 mana ce tour).',
    forme:'proj', rarity:'common', formeDmg:2, elan:true },

  // ── HYBRIDES — combos sans setup ────────────────────────────────────────
  // Chaque hybride porte son propre combo mais ferme un autre axe.

  // Embrasure : Choc thermique sans Givré → ferme Glace
  { id:'embrasure_1',     type:'element', name:'Embrasure',
    cost:3,  effect:'6 dgt + Brûlure (2). Burst Feu mono-cible, sans Givré requis.',
    elem:'feu', rarity:'rare', dmgOverride:6, bruleStacks:2 },

  // Brise-éclat : Fracture sans Fragile → ferme Choc thermique
  { id:'briseeclat_1',    type:'element', name:'Brise-éclat',
    cost:3,  effect:'1 dgt + Fragile (1) + Stun garanti. Mono-cible uniquement (Projectile).',
    elem:'glace', rarity:'rare', forceStun:true, applyFragile:true, fragileDuration:1,
    formeRestricted:['proj'] },

  // Onde de choc : Détonation sans Feu → ferme stack-Brûlure
  { id:'ondechoc_1',      type:'element', name:'Onde de choc',
    cost:3,  effect:'Applique 3 Brûlure puis détonne immédiatement (~8 dgt + Fragile).',
    elem:'vide', rarity:'rare', instantDetonate:true, bruleStacks:3, drawCount:0 },

  // Cataclysme : setup explosif avec Élan — le "moment" de run
  { id:'cataclysme_1',    type:'element', name:'Cataclysme',
    cost:5,  effect:'Brûlure (3) + Givré (2) + Fragile (2). Élan. Combos ce tour +2 dgt.',
    elem:'cataclysme', rarity:'epic',
    bruleStacks:3, givreDuration:2, fragileDuration:2, elan:true, comboBonus:2 },

  // ── TEMPO — économie d'actions / recyclage ───────────────────────────────

  // Mémoire des cendres : recyclage Feu — pousse vers identité mono-élément
  { id:'memoirecendres_1',type:'element', name:'Mémoire des cendres',
    cost:2,  effect:'3 dgt + Brûlure (2). Rappelle un Feu de la défausse en main.',
    elem:'feu', rarity:'rare', recallFromDiscard:'feu' },

  // Souffle : action gratuite ponctuelle
  { id:'souffle_1',       type:'forme',   name:'Souffle',
    cost:2,  effect:'1 ennemi ciblé — cet assemblage ne consomme pas d\'action.',
    forme:'proj', rarity:'rare', freeAction:true },

  // Stèle : action gratuite + pioche 2
  { id:'stele_1',         type:'forme',   name:'Stèle',
    cost:2,  effect:'1 ennemi ciblé — pioche 2 cartes, sans consommer d\'action.',
    forme:'proj', rarity:'rare', freeAction:true, drawCount:2 },

  // Cycle des Éléments : moteur — l'Élément revient en main plus fort
  { id:'cycle_1',         type:'forme',   name:'Cycle des Éléments',
    cost:3,  effect:'1 ennemi ciblé — l\'Élément retourne en main, son coût baisse de 1 (min 0).',
    forme:'proj', rarity:'epic', recycleSelf:true },

  // ── LOCKED — débloquables via Fragments ─────────────────────────────────
  { id:'glaceMortelle_1', type:'element', name:'Glace mortelle',
    cost:3,  effect:'2 dgt + Givré (2 tours) + Fragile (2 tours)',
    elem:'glace', rarity:'rare',
    givreDuration:2, applyFragile:true, fragileDuration:2,
    locked:true, unlockCost:5 },

  { id:'maelstrom_1',     type:'element', name:'Maelström',
    cost:3,  effect:'3 dgt + Brûlure (3) + Givré (2) + Fragile (2)',
    elem:'maelstrom', rarity:'epic',
    bruleStacks:3, givreDuration:2, fragileDuration:2,
    locked:true, unlockCost:12 },
];

const ENCOUNTERS = [
  {
    name:'Combat 1 — La Goule',
    enemies:[{ name:'Goule', maxHp:8, hp:8, atk:2 }]
  },
  {
    name:'Combat 2 — La Sentinelle',
    enemies:[{ name:'Sentinelle', maxHp:14, hp:14, atk:4 }]
  },
  {
    name:'Combat 3 — L\'Essaim',
    enemies:[
      { name:'Essaim A', maxHp:4, hp:4, atk:1, startShield:2 },
      { name:'Essaim B', maxHp:4, hp:4, atk:1 },
      { name:'Essaim C', maxHp:4, hp:4, atk:1 },
    ]
  },
  {
    name:'Combat 4 — Le Bastion',
    enemies:[{
      name:'Bastion', maxHp:14, hp:14, atk:3,
      archetype:'tank', startShield:5, shieldRegen:0,
    }]
  },
  {
    name:'Combat 5 — Le Réacteur',
    enemies:[{
      name:'Réacteur', maxHp:10, hp:10, atk:2,
      archetype:'catalyst',
      archetypeHint: 'Réagit aux combos → +1 atk',
    }]
  },
  {
    name:'Combat 6 — Le Berserker',
    enemies:[{
      name:'Berserker', maxHp:14, hp:14, atk:2,
      archetype:'charged', chargedDamage:7, chargedInterval:2,
    }]
  },
  {
    name:'Combat 7 — Le Briseur',
    enemies:[
      { name:'Briseur',     maxHp:14, hp:14, atk:3,
        archetype:'tank', startShield:4, shieldRegen:1 },
      { name:'Serviteur A', maxHp:5,  hp:5,  atk:1,
        archetype:'catalyst', archetypeHint:'Réagit aux combos → +1 atk' },
      { name:'Serviteur B', maxHp:5,  hp:5,  atk:1,
        archetype:'catalyst', archetypeHint:'Réagit aux combos → +1 atk' },
    ]
  },
];

const RARITY_WEIGHTS = [
  ['common',  55],
  ['rare',    35],
  ['epic',    10],
];

// ============================================================
// ZONE 2 — ÉTAT DU JEU
// ============================================================

let G = {};

function pickRarity() {
  const total = RARITY_WEIGHTS.reduce((s, [_, w]) => s + w, 0);
  let roll = Math.random() * total;
  for(const [rarity, weight] of RARITY_WEIGHTS) {
    roll -= weight;
    if(roll < 0) return rarity;
  }
  return 'common';
}

function generateRewardChoices(count) {
  const choices = [];
  const usedIds = new Set();
  const availablePool = REWARD_POOL.filter(c =>
    !c.locked || G.meta.unlockedCards.includes(c.id)
  );

  for(let i = 0; i < count; i++) {
    const rarity = pickRarity();

    let candidates = availablePool.filter(c => c.rarity === rarity && !usedIds.has(c.id));
    if(candidates.length === 0) {
      candidates = availablePool.filter(c => !usedIds.has(c.id));
      if(candidates.length === 0) break;
    }
    const card = candidates[Math.floor(Math.random() * candidates.length)];
    usedIds.add(card.id);
    choices.push({ ...card, id: `${card.id}_${Date.now()}_${i}` });
  }
  return choices;
}

function shuffle(arr) {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function newEnemy(e) {
  return {
    ...e,
    givre:0, brule:0, fragile:0, stun:false,
    enemyShield: e.startShield ?? 0,
    intent: null,
    appliedStates: [],
    atkBonus: 0,
  };
}

function initRun() {
  const meta = G.meta || loadMeta();
  G = {
    meta,
    run: {
      playerHp: DEV.godMode ? 50 : 20,
      playerMaxHp: DEV.godMode ? 50 : 20,
      deck: shuffle(CARDS_DEF.map(c => ({...c}))),
      combatIndex: 0,
      combatList: [0, 1, 2, 3, 4, 5, 6],
      fragmentsEarned: 0,
    },
    scene: 'combat',
    log: [],
  };
  // Header de run
  runLog(`═══ NOUVELLE RUN — ${new Date().toLocaleString('fr-FR')} ═══`);
  runLog(`PV : ${G.run.playerHp}/${G.run.playerMaxHp}`);
  initCombat(0);
}

function initCombat(index) {
  const run = G.run;
  const encounterId = run.combatList[index];
  const enc = ENCOUNTERS[encounterId];

  if(index > 0) {
    const HEAL_BETWEEN_COMBATS = 6;
    const healed = Math.min(run.playerMaxHp, run.playerHp + HEAL_BETWEEN_COMBATS);
    const actualHeal = healed - run.playerHp;
    run.playerHp = healed;
    if(actualHeal > 0) {
      addLog(`Tu te soignes de ${actualHeal} PV avant le combat. (${run.playerHp}/${run.playerMaxHp})`, 'good');
    }
  }

  G.encIdx = index;
  G.encName = enc.name;
  runLog(`\n══ ${enc.name} ══`);
  runLog(`PV début : ${run.playerHp}/${run.playerMaxHp}`);
  const deckSummary = run.deck.map(c=>c.name).join(', ');
  runLog(`Deck (${run.deck.length}) : ${deckSummary}`);
  G.playerHp = run.playerHp;
  G.playerMaxHp = run.playerMaxHp;
  G.shield = 0;
  G.mana = 6;
  G.maxMana = 6;
  G.actionsLeft = 2;
  G.selected = [];
  G.selectedTarget = null;

  G.combat = {
    enemies: enc.enemies.map(newEnemy),
    deck: shuffle([...run.deck]),
    hand: [],
    discard: [],
    comboBonusTurn: 0,   // Reset au début de chaque combat et de chaque tour
  };

  // Fix recycleSelf : restaurer le coût d'origine des cartes
  // (les modifications de Cycle ne valent que pour le combat où elles ont eu lieu)
  G.combat.deck.forEach(c => {
    if(c._origCost === undefined) c._origCost = c.cost;
    c.cost = c._origCost;
  });

  drawToFull();
  addLog(`--- ${enc.name} --- Mana ${G.mana}, Actions ${G.actionsLeft}.`, 'info');
  transitionTo('combat');
}

function onCombatVictory() {
  G.run.playerHp = G.playerHp;
  G.run.deck = [...G.combat.deck, ...G.combat.hand, ...G.combat.discard];

  const isLast = G.run.combatIndex >= G.run.combatList.length - 1;
  const fragmentsThisCombat = isLast ? 3 : 1;
  G.run.fragmentsEarned += fragmentsThisCombat;
  addLog(`🏆 Victoire ! +${fragmentsThisCombat} Fragment(s) (total run : ${G.run.fragmentsEarned}).`, 'good');
  runLog(`→ Combat terminé — PV : ${G.playerHp}/${G.playerMaxHp} — Fragments run : ${G.run.fragmentsEarned}`);

  if(isLast) {
    commitRunRewards(true);
    transitionTo('meta');
  } else {
    G.rewardChoices = generateRewardChoices(3);
    transitionTo('reward');
  }
}

function onCombatDefeat() {
  runLog(`\n✗ DÉFAITE — Fragments conservés : ${G.run.fragmentsEarned}`);
  commitRunRewards(false);
  transitionTo('meta');
}

function onRewardChosen() {
  G.run.combatIndex++;
  initCombat(G.run.combatIndex);
}

function onUnlockCard(cardId) {
  const success = unlockCard(cardId);
  if(success) render();
}

function onStartRun() {
  G.lastRunResult = null;
  initRun();
}

function drawToFull() {
  while(G.combat.hand.length < 4) {
    if(G.combat.deck.length === 0) {
      if(G.combat.discard.length === 0) break;
      G.combat.deck = shuffle([...G.combat.discard]);
      G.combat.discard = [];
      addLog('Pioche épuisée — la défausse est mélangée.', 'warn');
    }
    G.combat.hand.push(G.combat.deck.pop());
  }
}

function addLog(msg, type='') {
  G.log.unshift({ msg, type });
  if(G.log.length > 50) G.log.pop();
  // Propagation vers le journal de run (texte brut, sans HTML)
  runLog(msg);
}

// Journal de RUN — persiste à travers les combats, affichable à la fin.
// Ne contient PAS de HTML — texte brut copiable.
function runLog(msg) {
  if(!G.run) return;
  if(!G.run.runLog) G.run.runLog = [];
  G.run.runLog.push(msg);
}

// ============================================================
// ZONE 3 — LOGIQUE PURE
// ============================================================

function commitRunRewards(won) {
  G.meta.fragments += G.run.fragmentsEarned;
  if(won) G.meta.totalRunsWon++;
  else G.meta.totalRunsLost++;
  saveMeta();
  G.lastRunResult = { won, fragmentsEarned: G.run.fragmentsEarned };
}

function unlockCard(cardId) {
  const card = REWARD_POOL.find(c => c.id === cardId);
  if(!card) { console.error(`Carte introuvable : ${cardId}`); return false; }
  if(!card.locked) { console.warn(`Carte déjà déverrouillée : ${cardId}`); return false; }
  if(G.meta.unlockedCards.includes(cardId)) { console.warn(`Carte déjà débloquée : ${cardId}`); return false; }
  if(G.meta.fragments < card.unlockCost) { console.warn(`Pas assez de Fragments : ${G.meta.fragments}/${card.unlockCost}`); return false; }
  G.meta.fragments -= card.unlockCost;
  G.meta.unlockedCards.push(cardId);
  saveMeta();
  return true;
}

function applyStateToEnemy(target, stateName, value) {
  if(stateName === 'givre')        target.givre = value;
  else if(stateName === 'brule')   target.brule = (target.brule || 0) + value;
  else if(stateName === 'fragile') target.fragile = value;

  if(!target.appliedStates.includes(stateName)) {
    target.appliedStates.push(stateName);
  }
}

function triggerCatalystReaction(target, comboName) {
  if(target.archetype !== 'catalyst') return;
  target.atkBonus = (target.atkBonus || 0) + 1;
  addLog(`⚡ Réaction ! Le ${target.name} absorbe le ${comboName} et gagne +1 atk (total : ${target.atk + target.atkBonus}).`, 'warn');
}

// ── applyElementEffect ──────────────────────────────────────────────────────
// Gère : feu, glace (+ forceStun), vide (+ instantDetonate),
//        cataclysme (nouveau), maelstrom.
// Lit  : G.combat.comboBonusTurn pour le bonus Cataclysme sur les combos.
// ────────────────────────────────────────────────────────────────────────────
function applyElementEffect(el, target) {
  let dmg = 0;
  const comboBonus = G.combat.comboBonusTurn || 0;

  // ── FEU ──
  if(el.elem === 'feu') {
    let baseDmg = el.dmgOverride ?? 3;
    let comboTriggered = false;

    if(target.givre > 0) {
      baseDmg *= 2;
      if(comboBonus) baseDmg += comboBonus;
      target.givre = 0;
      comboTriggered = true;
      addLog(
        `🔥❄ CHOC THERMIQUE sur ${target.name} ! ${baseDmg} dgt (x2${comboBonus ? ' +'+comboBonus+' Cataclysme' : ''}).`,
        'combo'
      );
      triggerCatalystReaction(target, 'Choc Thermique');
    }

    dmg = baseDmg;
    const feuEffDmg = Math.max(0, dmg - target.enemyShield);
    if(target.hp - feuEffDmg > 0) {
      const stacks = el.bruleStacks ?? 2;
      applyStateToEnemy(target, 'brule', stacks);
      if(!comboTriggered) addLog(`Feu → ${target.name} : ${dmg} dgt + ${stacks} Brûlure.`, 'good');
    } else {
      if(!comboTriggered) addLog(`Feu → ${target.name} : ${dmg} dgt (létal).`, 'good');
    }
  }

  // ── GLACE ──
  else if(el.elem === 'glace') {
    dmg = 1;

    if(el.forceStun) {
      // Brise-éclat : stun garanti, pas de Givré
      target.stun = true;
      const glaceEffDmg = Math.max(0, dmg - target.enemyShield);
      if(target.hp - glaceEffDmg > 0) {
        applyStateToEnemy(target, 'fragile', el.fragileDuration ?? 1);
        addLog(`🔨 Brise-éclat → ${target.name} : ${dmg} dgt + Stun + Fragile (${target.fragile} tour(s)).`, 'good');
      } else {
        addLog(`🔨 Brise-éclat → ${target.name} : ${dmg} dgt (létal) + Stun.`, 'good');
      }
      // Pas de Givré — le forceStun court-circuite la branche Givré ci-dessous

    } else if(target.fragile > 0) {
      // Fracture classique
      target.stun = true;
      target.fragile = 0;
      if(comboBonus) dmg += comboBonus;
      addLog(
        `💎❄ FRACTURE sur ${target.name} ! Stun garanti${comboBonus ? ', +'+comboBonus+' dgt Cataclysme' : ''}.`,
        'combo'
      );
      triggerCatalystReaction(target, 'Fracture');
    } else {
      addLog(`Glace → ${target.name} : ${dmg} dgt + Givré.`, 'good');
    }

    // Givré + Fragile optionnel — uniquement si pas forceStun
    if(!el.forceStun) {
      const glaceEffDmg = Math.max(0, dmg - target.enemyShield);
      if(target.hp - glaceEffDmg > 0) {
        applyStateToEnemy(target, 'givre', el.givreDuration ?? 2);
        if(el.applyFragile) {
          applyStateToEnemy(target, 'fragile', el.fragileDuration ?? 1);
          addLog(`${target.name} devient aussi Fragile (${target.fragile} tour(s)).`, 'good');
        }
      }
    }
  }

  // ── VIDE ──
  else if(el.elem === 'vide') {
    let baseDmg = 2;

    if(el.instantDetonate) {
      // Onde de choc : applique ses stacks puis détonne tout immédiatement
      const bruStacks = el.bruleStacks ?? 3;
      target.brule = (target.brule || 0) + bruStacks;
      const totalBrule = target.brule;
      baseDmg += totalBrule * 2;
      if(comboBonus) baseDmg += comboBonus;
      target.brule = 0;   // Pas de Brûlure résiduelle
      addLog(
        `💥 Onde de choc → ${target.name} : ${totalBrule} Brûlure détonées ! ${baseDmg} dgt + Fragile.`,
        'combo'
      );
      triggerCatalystReaction(target, 'Détonation');

    } else if(target.brule > 0) {
      // Détonation classique
      const detonation = target.brule;
      baseDmg += detonation * 2;
      if(comboBonus) baseDmg += comboBonus;
      target.brule = 0;
      addLog(
        `💥🔥 DÉTONATION sur ${target.name} ! Vide consume ${detonation} Brûlure → ${baseDmg} dgt${comboBonus ? ' (+'+comboBonus+' Cataclysme)' : ''}.`,
        'combo'
      );
      triggerCatalystReaction(target, 'Détonation');
    } else {
      addLog(`Vide → ${target.name} : ${baseDmg} dgt + Fragile + pioche.`, 'good');
    }

    dmg = baseDmg;
    const videEffDmg = Math.max(0, dmg - target.enemyShield);
    if(target.hp - videEffDmg > 0) applyStateToEnemy(target, 'fragile', el.fragileDuration ?? 1);
  }

  // ── CATACLYSME (nouvelle branche) ──
  else if(el.elem === 'cataclysme') {
    // Pas de dégâts directs. Applique les 3 États + arme le bonus combos.
    dmg = 0;
    applyStateToEnemy(target, 'brule',   el.bruleStacks  ?? 3);
    applyStateToEnemy(target, 'givre',   el.givreDuration ?? 2);
    applyStateToEnemy(target, 'fragile', el.fragileDuration ?? 2);
    G.combat.comboBonusTurn = (G.combat.comboBonusTurn || 0) + (el.comboBonus ?? 2);
    addLog(
      `🌋 Cataclysme → ${target.name} : Brûlure(${target.brule})+Givré(${target.givre})+Fragile(${target.fragile}). Combos ce tour +${el.comboBonus ?? 2} dgt !`,
      'combo'
    );
  }

  // ── MAELSTRÖM ──
  else if(el.elem === 'maelstrom') {
    dmg = 3;
    if(target.hp - dmg > 0) {
      const bStacks = el.bruleStacks ?? 2;
      applyStateToEnemy(target, 'brule',   bStacks);
      applyStateToEnemy(target, 'givre',   el.givreDuration ?? 1);
      applyStateToEnemy(target, 'fragile', el.fragileDuration ?? 1);
    }
    addLog(`🌀 MAELSTRÖM sur ${target.name} : ${dmg} dgt + Brûlure/Givré/Fragile appliqués.`, 'combo');
  }

  // ── Application des dégâts (bouclier ennemi en premier) ──
  let remainingDmg = dmg;
  if(target.enemyShield > 0 && remainingDmg > 0) {
    const absorbed = Math.min(target.enemyShield, remainingDmg);
    target.enemyShield -= absorbed;
    remainingDmg -= absorbed;
    if(absorbed > 0) {
      addLog(`${target.name} : ${absorbed} dgt absorbés par son bouclier (reste ${target.enemyShield}).`, 'warn');
    }
  }
  target.hp = Math.max(0, target.hp - remainingDmg);
  return dmg;
}

// ── assembleAction ─────────────────────────────────────────────────────────
// Nouvelles mécaniques gérées :
//   fo.freeAction    → l'assemblage ne consomme pas d'action
//   fo.recycleSelf   → l'Élément retourne en main avec coût -1
//   el.elan / fo.elan → +1 action +1 mana ce tour (mot-clé Élan)
//   fo.formeDmg      → dgt bonus de la Forme sur la cible principale (Étincelle)
//   el.recallFromDiscard → rappelle un Élément de type X de la défausse
//   fo.drawCount     → pioche N cartes après l'assemblage (Stèle)
// ──────────────────────────────────────────────────────────────────────────
function assembleAction() {
  const sel = G.selected.map(id => G.combat.hand.find(c=>c.id===id));
  const el = sel.find(c=>c.type==='element');
  const fo = sel.find(c=>c.type==='forme');
  if(!el || !fo) { addLog('Sélectionne 1 Élément + 1 Forme.','warn'); render(); return; }

  if(el.formeRestricted && !el.formeRestricted.includes(fo.forme)) {
    addLog(`${el.name} ne peut être combiné qu'avec : ${el.formeRestricted.join(', ')}.`, 'warn');
    render(); return;
  }

  const totalCost = el.cost + fo.cost;
  if(totalCost > G.mana) { addLog(`Pas assez de mana (besoin ${totalCost}, dispo ${G.mana}).`,'bad'); render(); return; }

  // freeAction : peut jouer même à 0 action
  if(G.actionsLeft <= 0 && !fo.freeAction) {
    addLog('Tu as déjà assemblé 2 fois ce tour.','warn'); render(); return;
  }

  const living = G.combat.enemies.filter(e=>e.hp>0);
  if(living.length === 0) return;

  if(fo.forme === 'proj' && G.selectedTarget === null && living.length > 1) {
    addLog('Choisis une cible pour cet assemblage.','warn'); render(); return;
  }

  // Déduction des ressources
  G.mana -= totalCost;
  if(!fo.freeAction) G.actionsLeft--;   // freeAction = action non consommée

  // Retrait des cartes de la main
  G.combat.hand = G.combat.hand.filter(c=>!G.selected.includes(c.id));

  // ── Gestion de la destination de l'Élément ──
  if(fo.recycleSelf) {
    // Cycle des Éléments : l'Élément revient en main avec coût réduit
    el.cost = Math.max(0, (el.cost || 0) - 1);
    G.combat.hand.push(el);
    G.combat.discard.push(fo);
    addLog(`Cycle → ${el.name} retourne en main (coût : ${el.cost} mana).`, 'info');
  } else {
    G.combat.discard.push(el, fo);
  }

  G.selected = [];

  // ── Résolution des effets ──
  if(fo.forme === 'arm') {
    const shieldAmount = fo.shieldAmount ?? 4;
    G.shield += shieldAmount;
    addLog(`${el.name} + ${fo.name} → +${shieldAmount} bouclier (total ${G.shield}).`, 'good');
  }
  else {
    let targets;
    if(fo.forme === 'zone') {
      targets = living;
      addLog(`${el.name} + Zone → frappe tous les ennemis :`, 'info');
    } else {
      let target;
      if(living.length === 1) target = living[0];
      else target = living[G.selectedTarget] || living[0];
      targets = [target];
    }

    // Effet principal de l'Élément sur chaque cible
    targets.forEach(e => applyElementEffect(el, e));

    // Bonus de dgt de la Forme (Étincelle) → cible principale uniquement
    if(fo.formeDmg) {
      const primaryTarget = targets[0];
      if(primaryTarget && primaryTarget.hp > 0) {
        let bonusDmg = fo.formeDmg;
        if(primaryTarget.enemyShield > 0) {
          const absorbed = Math.min(primaryTarget.enemyShield, bonusDmg);
          primaryTarget.enemyShield -= absorbed;
          bonusDmg -= absorbed;
          if(absorbed > 0) addLog(`${fo.name} : ${absorbed} dgt bonus absorbés par le bouclier.`, 'warn');
        }
        if(bonusDmg > 0) {
          primaryTarget.hp = Math.max(0, primaryTarget.hp - bonusDmg);
          addLog(`${fo.name} → ${bonusDmg} dgt bonus sur ${primaryTarget.name}.`, 'good');
        }
      }
    }

    // Pioche de l'Élément (Vide de base — hors instantDetonate)
    if(el.elem === 'vide' && !el.instantDetonate) {
      const drawCount = el.drawCount ?? 1;
      for(let i = 0; i < drawCount; i++) drawCard();
      if(drawCount > 0) addLog(`Vide → tu pioches ${drawCount} carte(s).`, 'info');
    }

    // Pioche de la Forme (Stèle)
    if(fo.drawCount) {
      for(let i = 0; i < fo.drawCount; i++) drawCard();
      addLog(`${fo.name} → tu pioches ${fo.drawCount} carte(s).`, 'info');
    }
  }

  // ── Rappel de défausse (Mémoire des cendres) ──
  // Se déclenche après que la carte est en défausse — exclut la carte jouée.
  if(el.recallFromDiscard) {
    const discardIdx = G.combat.discard.findIndex(
      c => c.elem === el.recallFromDiscard && c.id !== el.id
    );
    if(discardIdx >= 0) {
      const recalled = G.combat.discard.splice(discardIdx, 1)[0];
      G.combat.hand.push(recalled);
      addLog(`Mémoire des cendres → ${recalled.name} rappelé de la défausse.`, 'info');
    }
  }

  // ── Élan — traité en dernier, après tous les effets ──
  if(el.elan || fo.elan) {
    G.actionsLeft++;
    G.mana++;
    addLog('⚡ Élan ! +1 action et +1 mana pour ce tour.', 'info');
  }

  G.selectedTarget = null;
  checkWin();
  render();
}

function drawCard() {
  if(G.combat.deck.length === 0) {
    if(G.combat.discard.length === 0) return;
    G.combat.deck = shuffle([...G.combat.discard]);
    G.combat.discard = [];
  }
  G.combat.hand.push(G.combat.deck.pop());
}

function discardCard() {
  if(G.scene !== 'combat') return;
  if(G.actionsLeft <= 0) { addLog('Tu n\'as plus d\'action ce tour.', 'warn'); render(); return; }
  if(G.selected.length !== 1) { addLog('Sélectionne exactement 1 carte à défausser.', 'warn'); render(); return; }

  const cardId = G.selected[0];
  const card = G.combat.hand.find(c => c.id === cardId);
  if(!card) return;

  G.combat.hand = G.combat.hand.filter(c => c.id !== cardId);
  G.combat.discard.push(card);
  G.selected = [];
  G.actionsLeft--;

  drawCard();
  addLog(`Défausse : ${card.name}. Tu pioches une nouvelle carte.`, 'info');
  render();
}

function checkWin() {
  if(G.combat.enemies.every(e=>e.hp<=0)) { onCombatVictory(); return; }
  if(G.playerHp <= 0)                    { onCombatDefeat();  return; }
}

function endTurn() {
  // Reset du bonus combos Cataclysme au début du tour ennemi
  G.combat.comboBonusTurn = 0;

  G.selected = []; G.selectedTarget = null;
  addLog('--- Tour ennemi ---', 'info');

  // 1. Tick des Brûlures
  G.combat.enemies.filter(e=>e.hp>0).forEach(e => {
    if(e.brule > 0) {
      e.hp = Math.max(0, e.hp - 1);
      e.brule -= 1;
      addLog(`${e.name} subit 1 dgt de Brûlure (${e.brule} restante).`, 'good');
    }
  });
  checkWin();
  if(G.scene !== 'combat') return;

  // 2. Attaques ennemies
  G.combat.enemies.filter(e=>e.hp>0).forEach(e => {
    if(e.stun) {
      addLog(`${e.name} est stunné, rate son tour.`,'info');
      e.stun = false;
      if(e.intent) {
        addLog(`${e.name} interrompt son attaque chargée !`, 'good');
        e.intent = null;
      }
      return;
    }

    let dmg = (e.atk + (e.atkBonus || 0));
    let attackLabel = e.name;

    if(e.archetype === 'charged' && e.intent && e.intent.type === 'charged') {
      dmg = e.intent.damage;
      attackLabel = `${e.name} ATTAQUE CHARGÉE`;
      e.intent = null;
    }

    if(G.shield > 0) {
      const absorbed = Math.min(G.shield, dmg);
      G.shield -= absorbed; dmg -= absorbed;
      addLog(`${attackLabel} attaque : ${absorbed} absorbé par le bouclier.`, 'warn');
    }
    if(dmg > 0) {
      G.playerHp = Math.max(0, G.playerHp - dmg);
      addLog(`${attackLabel} inflige ${dmg} dgt. PV joueur : ${G.playerHp}/${G.playerMaxHp}.`, 'bad');
    }
  });

  if(G.playerHp <= 0) {
    addLog('☠ Tu as été vaincu.', 'bad');
    onCombatDefeat();
    return;
  }

  // ── PATCH 1 : décrémentation des États — UNE SEULE FOIS ──
  G.combat.enemies.forEach(e => {
    if(e.givre > 0)   e.givre   -= 1;
    if(e.fragile > 0) e.fragile -= 1;
  });

  // 3. Fin de tour — archétypes
  G.combat.enemies.filter(e=>e.hp>0).forEach(e => {
    if(e.archetype === 'tank' && e.shieldRegen) {
      const before = e.enemyShield;
      e.enemyShield += e.shieldRegen;
      addLog(`${e.name} régénère ${e.shieldRegen} bouclier (${before} → ${e.enemyShield}).`, 'warn');
    }
    if(e.archetype === 'charged') {
      e.chargedCounter = (e.chargedCounter || 0) + 1;
      if(e.chargedCounter >= (e.chargedInterval || 2)) {
        e.intent = { type:'charged', damage: e.chargedDamage };
        e.chargedCounter = 0;
        addLog(`⚠️ ${e.name} prépare une attaque chargée : ${e.chargedDamage} dgt au prochain tour !`, 'warn');
      }
    }
  });

  // 4. Reset joueur
  G.shield = 0; G.mana = G.maxMana; G.actionsLeft = 2;
  drawToFull();
  addLog(`--- Ton tour --- Mana ${G.mana}, Actions ${G.actionsLeft}, Main ${G.combat.hand.length}.`, 'info');
  render();
}

function playConsumable() {
  if(G.scene !== 'combat') return;
  if(G.actionsLeft <= 0) { addLog('Tu n\'as plus d\'action ce tour.', 'warn'); render(); return; }
  if(G.selected.length !== 1) return;

  const cardId = G.selected[0];
  const card = G.combat.hand.find(c => c.id === cardId);
  if(!card || card.type !== 'consumable') return;

  if(card.cost > G.mana) {
    addLog(`Pas assez de mana (besoin ${card.cost}, dispo ${G.mana}).`, 'bad');
    render(); return;
  }

  G.combat.hand = G.combat.hand.filter(c => c.id !== cardId);
  G.combat.discard.push(card);
  G.mana -= card.cost;
  G.actionsLeft--;
  G.selected = [];

  if(card.heal) {
    const before = G.playerHp;
    G.playerHp = Math.min(G.playerMaxHp, G.playerHp + card.heal);
    const actualHeal = G.playerHp - before;
    addLog(`${card.name} → tu soignes ${actualHeal} PV. (${G.playerHp}/${G.playerMaxHp})`, 'good');
  }

  render();
}

// ============================================================
// ZONE 5 — ÉVÉNEMENTS UTILISATEUR
// ============================================================

function selectCard(id) {
  if(G.scene !== 'combat') return;
  const idx = G.selected.indexOf(id);
  if(idx >= 0) { G.selected.splice(idx,1); render(); return; }
  const card = G.combat.hand.find(c=>c.id===id);
  if(!card) return;

  if(card.type === 'consumable') {
    G.selected = [id];
    render(); return;
  }

  const consumableSelected = G.selected.some(sid =>
    G.combat.hand.find(c=>c.id===sid)?.type === 'consumable'
  );
  if(consumableSelected) G.selected = [];

  const alreadyEl = G.selected.some(sid => G.combat.hand.find(c=>c.id===sid)?.type==='element');
  const alreadyFo = G.selected.some(sid => G.combat.hand.find(c=>c.id===sid)?.type==='forme');
  if(card.type==='element' && alreadyEl) { addLog('Tu as déjà sélectionné un Élément.','warn'); render(); return; }
  if(card.type==='forme'   && alreadyFo) { addLog('Tu as déjà sélectionné une Forme.','warn');   render(); return; }
  G.selected.push(id);
  render();
}

function selectTarget(idx) {
  G.selectedTarget = idx;
  render();
}

function abandonRun() {
  if(!confirm('Abandonner cette run ? Tes Fragments accumulés seront conservés.')) return;
  commitRunRewards(false);
  transitionTo('meta');
}

function copyRunLog() {
  if(!G.run || !G.run.runLog) return;
  const text = G.run.runLog.join('\n');
  navigator.clipboard.writeText(text).then(
    () => alert('Journal copié dans le presse-papier.'),
    () => {
      // Fallback : afficher dans une textarea sélectionnable
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:60%;z-index:9999;';
      document.body.appendChild(ta);
      ta.select();
      alert('Sélection prête — fais Ctrl+C, puis ferme la fenêtre.');
      ta.addEventListener('blur', () => ta.remove());
    }
  );
}

// ============================================================
// ZONE 4 — RENDU
// ============================================================

function selectionType() {
  if(G.selected.length === 0) return 'none';
  const cards = G.selected.map(id => G.combat.hand.find(c=>c.id===id));
  if(cards.some(c => c?.type === 'consumable')) return 'consumable';
  return 'assembly';
}

function canPlay() {
  const t = selectionType();
  if(t === 'consumable') {
    const card = G.combat.hand.find(c => c.id === G.selected[0]);
    return card && card.cost <= G.mana && G.actionsLeft > 0;
  }
  if(t === 'assembly') return canAssemble();
  return false;
}

function canAssemble() {
  const sel = G.selected.map(id => G.combat.hand.find(c=>c.id===id));
  const el = sel.find(c=>c?.type==='element');
  const fo = sel.find(c=>c?.type==='forme');
  if(!el || !fo) return false;
  // Restriction de forme côté Élément
  if(el.formeRestricted && !el.formeRestricted.includes(fo.forme)) return false;
  const hasAction = G.actionsLeft > 0 || !!fo.freeAction;
  return (el.cost + fo.cost) <= G.mana && hasAction;
}

function canDiscard() {
  return G.selected.length === 1 && G.actionsLeft > 0;
}

function assemblyDescription() {
  const t = selectionType();

  if(t === 'consumable') {
    const card = G.combat.hand.find(c => c.id === G.selected[0]);
    return `→ ${card.name} : ${card.effect}. Coût : ${card.cost} mana.`;
  }

  const sel = G.selected.map(id => G.combat.hand.find(c=>c.id===id));
  const el = sel.find(c=>c?.type==='element');
  const fo = sel.find(c=>c?.type==='forme');
  if(!el && !fo) return 'Sélectionne 1 Élément + 1 Forme dans ta main.';
  if(el && !fo)  return `Élément choisi : ${el.name}. Sélectionne une Forme.`;
  if(!el && fo)  return `Forme choisie : ${fo.name}. Sélectionne un Élément.`;

  const cost = el.cost + fo.cost;
  let bonus = '';

  // Aperçus de combos sur les cibles
  if(fo.forme !== 'arm') {
    const living = G.combat.enemies.filter(e=>e.hp>0);
    const targets = fo.forme === 'zone' ? living :
                    (living.length === 1 ? living :
                     G.selectedTarget !== null ? [living[G.selectedTarget]] : []);
    targets.forEach(tgt => {
      if(!tgt) return;
      if(el.elem === 'feu'        && tgt.givre > 0)   bonus += `<span class="assembly-bonus">⚡ Choc thermique sur ${tgt.name} (x2)</span> `;
      if(el.elem === 'vide'       && tgt.brule > 0)   bonus += `<span class="assembly-bonus">⚡ Détonation sur ${tgt.name} (+${tgt.brule*2} dgt)</span> `;
      if(el.elem === 'glace'      && tgt.fragile > 0) bonus += `<span class="assembly-bonus">⚡ Fracture sur ${tgt.name} (stun)</span> `;
      if(el.elem === 'vide'       && el.instantDetonate && tgt.brule > 0)
        bonus += `<span class="assembly-bonus">⚡ Onde amplifie : +${tgt.brule*2} dgt bonus</span> `;
    });
    if(el.elem === 'cataclysme')
      bonus += `<span class="assembly-bonus">🌋 Élan + combos ce tour +${el.comboBonus ?? 2} dgt</span> `;
  }

  // Description de la Forme
  let baseDesc = '';
  if(fo.forme === 'arm')       baseDesc = `${el.name} + ${fo.name} → +${fo.shieldAmount ?? 4} bouclier`;
  else if(fo.forme === 'zone') baseDesc = `${el.name} + Zone → frappe tous`;
  else                         baseDesc = `${el.name} + ${fo.name} → 1 cible`;
  if(el.formeRestricted && !el.formeRestricted.includes(fo.forme)) {
    return `<span style="color:#f5a383">⚠️ ${el.name} ne peut être combiné qu'avec : ${el.formeRestricted.join(', ')}.</span>`;
  }

  // Indicateurs mécaniques
  let mecaDesc = '';
  if(fo.freeAction)  mecaDesc += ` <span style="color:#8bb8e8">Action gratuite.</span>`;
  if(fo.recycleSelf) mecaDesc += ` <span style="color:#8bb8e8">Élément recyclé.</span>`;
  if(fo.drawCount)   mecaDesc += ` <span style="color:#8bb8e8">Pioche ${fo.drawCount}.</span>`;
  if(el.elan || fo.elan) mecaDesc += ` <span class="assembly-bonus">Élan.</span>`;

  return `${baseDesc}. Coût : ${cost} mana.${mecaDesc} ${bonus}`;
}

function needsTargetChoice() {
  const sel = G.selected.map(id => G.combat.hand.find(c=>c.id===id));
  const fo = sel.find(c=>c?.type==='forme');
  if(!fo || fo.forme !== 'proj') return false;
  return G.combat.enemies.filter(e=>e.hp>0).length > 1;
}

// ── renderMeta ──────────────────────────────────────────────────────────────
function renderMeta() {
  const meta = G.meta;
  const lastRun = G.lastRunResult;

  let headerHTML = `<h1 style="font-size:24px;font-weight:500;margin-bottom:8px;">Méta-progression</h1>`;

  if(lastRun) {
    const title = lastRun.won ? 'Run terminée — victoire' : 'Run terminée — défaite';
    const titleColor = lastRun.won ? '#5dd4a3' : '#f5a383';
    headerHTML += `
      <div style="background:#2a2a2a;border-radius:8px;padding:12px 16px;margin-bottom:16px;">
        <div style="color:${titleColor};font-weight:500;margin-bottom:4px;">${title}</div>
        <div style="font-size:13px;color:#aaa;">+${lastRun.fragmentsEarned} Fragments gagnés cette run.</div>
      </div>`;
  }

  const runLogHTML = (lastRun && G.run && G.run.runLog && G.run.runLog.length > 0) ? `
  <div style="background:#2a2a2a;border-radius:8px;padding:12px 16px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-weight:500;">Journal de la run</div>
      <button class="btn" onclick="copyRunLog()" style="font-size:12px;padding:4px 12px;">
        📋 Copier le journal
      </button>
    </div>
    <details>
      <summary style="font-size:12px;color:#888;cursor:pointer;">Aperçu (cliquer pour développer)</summary>
      <pre style="font-size:11px;color:#aaa;white-space:pre-wrap;margin-top:8px;max-height:300px;overflow-y:auto;background:#1a1a1a;padding:8px;border-radius:4px;">${G.run.runLog.join('\n')}</pre>
    </details>
  </div>
` : '';

  const statsHTML = `
    <div class="stats-row" style="margin-bottom:24px;">
      <div class="stat-box"><div class="stat-val" style="color:#e8c97a;">${meta.fragments}</div><div class="stat-lbl">Fragments</div></div>
      <div class="stat-box"><div class="stat-val">${meta.totalRunsWon}</div><div class="stat-lbl">Runs gagnées</div></div>
      <div class="stat-box"><div class="stat-val">${meta.totalRunsLost}</div><div class="stat-lbl">Runs perdues</div></div>
      <div class="stat-box"><div class="stat-val">${meta.unlockedCards.length}</div><div class="stat-lbl">Cartes débloquées</div></div>
    </div>`;

  const lockedCards = REWARD_POOL.filter(c => c.locked && !meta.unlockedCards.includes(c.id));
  const lockedHTML = lockedCards.length > 0 ? `
    <div style="margin-bottom:24px;">
      <div class="zone-label">Cartes à débloquer</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        ${lockedCards.map(c => {
          const canAfford = meta.fragments >= c.unlockCost;
          return `
            <div class="reward-card rarity-${c.rarity}" style="opacity:0.7;cursor:default;">
              <div class="rarity-label">${c.rarity}</div>
              <div class="card-name">🔒 ${c.name}</div>
              <div class="card-effect">${c.effect}</div>
              <button class="btn ${canAfford?'btn-primary':''}"
                      onclick="onUnlockCard('${c.id}')"
                      ${!canAfford?'disabled':''}
                      style="margin-top:12px;width:100%;font-size:12px;">
                Débloquer — ${c.unlockCost} Fragments
              </button>
            </div>`;
        }).join('')}
      </div>
    </div>` : '';

  const unlockedCards = REWARD_POOL.filter(c => c.locked && meta.unlockedCards.includes(c.id));
  const unlockedHTML = unlockedCards.length > 0 ? `
    <div style="margin-bottom:24px;">
      <div class="zone-label">Cartes débloquées</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        ${unlockedCards.map(c => `
          <div class="reward-card rarity-${c.rarity}" style="cursor:default;">
            <div class="rarity-label">${c.rarity}</div>
            <div class="card-name">✓ ${c.name}</div>
            <div class="card-effect">${c.effect}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  const launchHTML = `
    <div style="margin-top:32px;">
      <button class="btn btn-primary" onclick="onStartRun()" style="font-size:16px;padding:14px 24px;width:100%;">
        Lancer une nouvelle run →
      </button>
    </div>`;

  document.getElementById('app').innerHTML = `
    <div style="padding:20px 0;">
      ${headerHTML}
      ${runLogHTML}
      ${statsHTML}
      ${lockedHTML}
      ${unlockedHTML}
      ${launchHTML}
    </div>`;
}

// ── renderCombat ────────────────────────────────────────────────────────────
function renderCombat() {
  const app = document.getElementById('app');

  // Bannière Cataclysme actif
  const comboBonusHTML = G.combat.comboBonusTurn > 0
    ? `<div class="combo-bonus-banner">
         🌋 Cataclysme actif — combos ce tour +${G.combat.comboBonusTurn} dgt
       </div>`
    : '';

  let enemyHTML = G.combat.enemies.map((e, i) => {
    const pct = Math.round((e.hp / e.maxHp) * 100);
    let states = '';
    if(e.givre > 0)   states += `<span class="state-badge state-givre">❄ Givré ${e.givre}</span>`;
    if(e.brule > 0)   states += `<span class="state-badge state-brule">🔥 Brûlure ${e.brule}</span>`;
    if(e.fragile > 0) states += `<span class="state-badge state-frag">💎 Fragile ${e.fragile}</span>`;
    if(e.stun)        states += `<span class="state-badge state-stun">Stunné</span>`;

    const totalAtk = e.atk + (e.atkBonus || 0);
    const atkDisplay = e.atkBonus > 0
      ? `Attaque : ${totalAtk} dgt/tour <span style="color:#f5a383">(+${e.atkBonus})</span>`
      : `Attaque : ${totalAtk} dgt/tour`;

    const shieldDisplay = e.enemyShield > 0
      ? `<div style="font-size:12px;color:#8bb8e8;margin-bottom:4px;">🛡️ Bouclier : ${e.enemyShield}</div>`
      : '';

    const intentDisplay = e.intent
      ? `<div style="font-size:12px;color:#f5a383;font-weight:500;margin-top:4px;">⚠️ Prépare : ${e.intent.damage} dgt !</div>`
      : '';

    const archetypeHint = e.archetypeHint
      ? `<div style="font-size:10px;color:#e8c97a;margin-top:3px;">⚡ ${e.archetypeHint}</div>`
      : '';

    return `<div class="enemy-card ${e.hp<=0?'dead':''}">
      <div class="enemy-name">${e.name}</div>
      <div class="enemy-atk">${atkDisplay}</div>
      ${archetypeHint}
      ${shieldDisplay}
      <div class="hp-bar-wrap"><div class="hp-bar" style="width:${pct}%"></div></div>
      <div class="hp-text">${e.hp} / ${e.maxHp} PV</div>
      ${intentDisplay}
      <div class="states-row">${states}</div>
    </div>`;
  }).join('');

  let handHTML = G.combat.hand.map(c => {
    const sel = G.selected.includes(c.id);
    const typeLabel = c.type === 'element' ? 'Élément' :
                      c.type === 'forme'   ? 'Forme'   : 'Consumable';
    return `<div class="card ${c.type} ${sel?'selected':''}" onclick="selectCard('${c.id}')">
      <div class="card-type">${typeLabel}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-cost">${c.cost} mana</div>
      <div class="card-effect">${c.effect}</div>
    </div>`;
  }).join('');

  if(G.combat.hand.length === 0)
    handHTML = `<div style="font-size:13px;color:#888;padding:8px;">Main vide — fin de tour ?</div>`;

  let targetHTML = '';
  if(needsTargetChoice()) {
    const living = G.combat.enemies.map((e,i)=>({e,i})).filter(o=>o.e.hp>0);
    targetHTML = `<div class="target-row">
      <div style="font-size:12px;color:#aaa;align-self:center">Cible :</div>
      ${living.map(o=>`<button class="target-btn ${G.selectedTarget===o.i?'selected':''}" onclick="selectTarget(${o.i})">${o.e.name}</button>`).join('')}
    </div>`;
  }

  const logHTML = G.log.slice(0,18).map(l=>`<div class="log-entry ${l.type}">${l.msg}</div>`).join('');

  const t = selectionType();
  const buttonLabel  = t === 'consumable' ? 'Jouer la carte' : 'Assembler';
  const buttonAction = t === 'consumable' ? 'playConsumable()' : 'assembleAction()';

  app.innerHTML = `
    <div class="synergies-banner">
      <b>Synergies :</b>
      Glace → Givré <span class="arrow">→</span> Feu x2 (Choc thermique).
      Feu → Brûlure <span class="arrow">→</span> Vide détonne (+2/stack).
      Vide → Fragile <span class="arrow">→</span> Glace stunne (Fracture).
      <b>Élan</b> = +1 action +1 mana ce tour.
    </div>

    <div>
      <div class="zone-label">${G.encName}</div>
      <div class="enemies-row">${enemyHTML}</div>
    </div>

    <hr class="divider">

    <div>
      <div class="zone-label">Ton état</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val">${G.playerHp}<span style="font-size:13px;color:#666">/${G.playerMaxHp}</span></div><div class="stat-lbl">PV</div></div>
        <div class="stat-box"><div class="stat-val">${G.shield}</div><div class="stat-lbl">Bouclier</div></div>
        <div class="stat-box"><div class="stat-val">${G.mana}<span style="font-size:13px;color:#666">/${G.maxMana}</span></div><div class="stat-lbl">Mana</div></div>
        <div class="stat-box"><div class="stat-val">${G.actionsLeft}</div><div class="stat-lbl">Actions</div></div>
      </div>
      ${comboBonusHTML}
    </div>

    <hr class="divider">

    <div>
      <div class="zone-label">Ta main (${G.combat.hand.length} cartes — pioche ${G.combat.deck.length}, défausse ${G.combat.discard.length})</div>
      <div class="hand-row">${handHTML}</div>
    </div>

    <div>
      <div class="zone-label">Zone d'assemblage</div>
      <div class="assembly-zone">
        <div class="assembly-preview">${assemblyDescription()}</div>
      </div>
      ${targetHTML}
    </div>

    <div class="actions-row">
      <button class="btn btn-primary" onclick="${buttonAction}" ${!canPlay()?'disabled':''}>${buttonLabel}</button>
      <button class="btn" onclick="discardCard()" ${!canDiscard()?'disabled':''}>Défausser</button>
      <button class="btn" onclick="endTurn()">Fin de tour →</button>
      <button class="btn" onclick="abandonRun()" style="margin-left:auto;font-size:12px;">Abandonner la run</button>
    </div>

    <hr class="divider">

    <div>
      <div class="zone-label">Journal de combat</div>
      <div class="log">${logHTML}</div>
    </div>`;
}

// ── renderReward ────────────────────────────────────────────────────────────
function renderReward() {
  const cardsHTML = G.rewardChoices.map((c, i) => {
    const costDisplay = c.cost === null ? 'Effet permanent' : `${c.cost} mana`;
    return `<div class="reward-card rarity-${c.rarity}" onclick="pickReward(${i})">
      <div class="rarity-label">${c.rarity}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-cost">${costDisplay}</div>
      <div class="card-effect">${c.effect}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div style="padding: 40px 20px; text-align: center;">
      <h2 style="margin-bottom: 24px;">Choisis une carte récompense</h2>
      <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px;">
        ${cardsHTML}
      </div>
      <button class="btn" onclick="skipReward()">Passer (ne rien prendre)</button>
    </div>`;
}

function pickReward(index) {
  const card = G.rewardChoices[index];
  const allChoices = G.rewardChoices.map(c => `${c.name} [${c.rarity}]`).join(' | ');
  runLog(`\n── Récompense — Choix proposés : ${allChoices}`);
  runLog(`── Récompense — Choisi : ${card.name} [${card.rarity}]`);

  if(card.type === 'reward_effect') {
    if(card.instantEffect === 'maxHpUp') {
      G.run.playerMaxHp += card.maxHpUp;
      G.run.playerHp = Math.min(G.run.playerMaxHp, G.run.playerHp + card.maxHpUp);
      addLog(`${card.name} → +${card.maxHpUp} PV max. (${G.run.playerHp}/${G.run.playerMaxHp})`, 'good');
    }
  } else {
    G.run.deck.push(card);
    addLog(`Carte ajoutée : ${card.name} (${card.rarity}).`, 'good');
  }

  G.rewardChoices = null;
  onRewardChosen();
}

function skipReward() {
  const allChoices = G.rewardChoices.map(c => `${c.name} [${c.rarity}]`).join(' | ');
  runLog(`\n── Récompense — Choix proposés : ${allChoices}`);
  runLog(`── Récompense — PASSÉE`);
  G.rewardChoices = null;
  onRewardChosen();
}

function transitionTo(scene) {
  G.scene = scene;
  render();
}

function render() {
  switch(G.scene) {
    case 'combat':  renderCombat(); break;
    case 'reward':  renderReward(); break;
    case 'meta':    renderMeta();   break;
  }
}

// ============================================================
// DÉMARRAGE
// ============================================================

G.meta = loadMeta();

window.resetMeta     = resetMeta;
window.unlockCard    = unlockCard;
window.giveFragments = (n) => { G.meta.fragments += n; saveMeta(); console.log(`+${n} Fragments. Total : ${G.meta.fragments}`); };
window.showMeta      = () => console.log(JSON.parse(JSON.stringify(G.meta)));

if(DEV.startCombat > 0) {
  initRun();
  G.run.combatIndex = DEV.startCombat;
  initCombat(DEV.startCombat);
} else {
  G.scene = 'meta';
  G.lastRunResult = null;
  render();
}
</script>

</body>
</html>
