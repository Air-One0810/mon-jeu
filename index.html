<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Proto V2 — Combat avec États</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .game { display: flex; flex-direction: column; gap: 14px; }

    .zone-label {
      font-size: 11px; font-weight: 500; color: #888;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px;
    }

    .synergies-banner {
      background: #2a2a2a; border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: #aaa; line-height: 1.7;
    }
    .synergies-banner b { color: #fff; font-weight: 500; }
    .synergies-banner .arrow { color: #9b87d4; }

    .enemies-row { display: flex; gap: 10px; flex-wrap: wrap; }

    .enemy-card {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 10px 14px; min-width: 130px; flex: 1; position: relative;
    }
    .enemy-card.dead { opacity: 0.35; }
    .enemy-name { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
    .enemy-atk { font-size: 12px; color: #aaa; margin-bottom: 6px; }
    .hp-bar-wrap { background: #1a1a1a; border-radius: 99px; height: 6px; overflow: hidden; }
    .hp-bar { height: 6px; border-radius: 99px; background: #D85A30; transition: width 0.3s; }
    .hp-text { font-size: 12px; color: #aaa; margin-top: 3px; }
    .states-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; min-height: 20px; }
    .state-badge {
      font-size: 10px; padding: 2px 7px; border-radius: 99px; font-weight: 500;
    }
    .state-givre { background: #1e3a5f; color: #8bb8e8; }
    .state-brule { background: #5a2a1c; color: #f5a383; }
    .state-frag  { background: #3d2f5e; color: #b29be0; }
    .state-stun  { background: #3a3a3a; color: #ccc; }

    .stats-row { display: flex; gap: 10px; }
    .stat-box {
      background: #2a2a2a; border-radius: 8px; padding: 8px 14px;
      flex: 1; text-align: center;
    }
    .stat-val { font-size: 20px; font-weight: 500; }
    .stat-lbl { font-size: 11px; color: #aaa; margin-top: 1px; }

    .hand-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .card {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 8px 10px; cursor: pointer; min-width: 95px; flex: 1;
      transition: border-color 0.15s, transform 0.1s; user-select: none;
    }
    .card:hover { border-color: #555; transform: translateY(-2px); }
    .card.element { border-top: 2px solid #1D9E75; }
    .card.forme { border-top: 2px solid #7F77DD; }
    .card.selected.element { border: 2px solid #1D9E75; background: #1f3a30; }
    .card.selected.forme { border: 2px solid #7F77DD; background: #2c2845; }
    .card-type { font-size: 10px; font-weight: 500; color: #888; margin-bottom: 2px; }
    .card-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .card-cost { font-size: 11px; color: #aaa; }
    .card-effect { font-size: 11px; color: #aaa; margin-top: 2px; line-height: 1.4; }

    .assembly-zone {
      background: #2a2a2a; border: 1px dashed #555; border-radius: 8px;
      padding: 12px; min-height: 64px; display: flex; align-items: center; gap: 10px;
    }
    .assembly-preview { font-size: 13px; color: #aaa; flex: 1; line-height: 1.5; }
    .assembly-bonus { color: #5dd4a3; font-weight: 500; }

    .btn {
      background: transparent; border: 1px solid #555; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 500; color: #e8e8e8;
      cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: #2a2a2a; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: #1D9E75; color: white; border-color: #1D9E75; }
    .btn-primary:hover { background: #0F6E56; }
    .btn-danger { background: #D85A30; color: white; border-color: #D85A30; }
    .btn-danger:hover { background: #993C1D; }

    .target-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .target-btn {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 8px;
      padding: 4px 10px; font-size: 12px; cursor: pointer; color: #e8e8e8;
    }
    .target-btn:hover { border-color: #378ADD; }
    .target-btn.selected { background: #1e3a5f; border: 1px solid #378ADD; color: #8bb8e8; }

    .log {
      background: #2a2a2a; border-radius: 8px; padding: 10px 14px;
      max-height: 140px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 3px;
    }
    .log-entry { font-size: 12px; color: #aaa; line-height: 1.5; }
    .log-entry.good { color: #5dd4a3; font-weight: 500; }
    .log-entry.bad { color: #f5a383; font-weight: 500; }
    .log-entry.info { color: #8bb8e8; font-weight: 500; }
    .log-entry.combo { color: #b29be0; font-weight: 500; }
    .log-entry.warn { color: #e8c97a; }

    .actions-row { display: flex; gap: 8px; flex-wrap: wrap; }

    .modal-bg {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center; z-index: 20;
    }
    .modal {
      background: #252525; border: 1px solid #3a3a3a; border-radius: 12px;
      padding: 24px; text-align: center; max-width: 320px;
    }
    .modal h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
    .modal p { font-size: 13px; color: #aaa; margin-bottom: 16px; line-height: 1.5; }

    .divider { border: none; border-top: 1px solid #3a3a3a; }

    .reward-card {
      background: #252525;
      border: 2px solid #555;
      border-radius: 12px;
      padding: 16px;
      width: 180px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s, border-color 0.15s;
    }
    .reward-card:hover {
      transform: translateY(-4px);
      border-color: #888;
    }
    .reward-card.rarity-common { border-color: #888; }
    .reward-card.rarity-rare   { border-color: #378ADD; box-shadow: 0 0 12px rgba(55,138,221,0.3); }
    .reward-card.rarity-epic   { border-color: #b29be0; box-shadow: 0 0 16px rgba(178,155,224,0.4); }
    .rarity-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .rarity-common .rarity-label { color: #888; }
    .rarity-rare   .rarity-label { color: #378ADD; }
    .rarity-epic   .rarity-label { color: #b29be0; }

    .card.consumable { border-top: 2px solid #d4a23d; }
    .card.selected.consumable { border: 2px solid #d4a23d; background: #3d2f1c; }

    /* Bannière Cataclysme active */
    .combo-bonus-banner {
      background: #3d2845; border-radius: 8px; padding: 6px 12px;
      font-size: 12px; color: #b29be0; font-weight: 500;
    }

    /* Bandeau Identité permanent */
    .identity-banner {
      background: #252525; border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: #aaa; line-height: 1.5;
      display: flex; align-items: center; gap: 10px;
      border-left: 3px solid #555;
    }
    .identity-banner.elem-feu      { border-left-color: #D85A30; }
    .identity-banner.elem-glace    { border-left-color: #378ADD; }
    .identity-banner.elem-vide     { border-left-color: #7F77DD; }
    .identity-banner.empty         { opacity: 0.5; }
    .identity-banner .id-name      { color: #fff; font-weight: 500; }
    .identity-banner .id-desc      { color: #aaa; }

    /* Carte Identité (écran de choix) */
    .identity-card {
      background: #252525;
      border: 2px solid #555;
      border-radius: 12px;
      padding: 16px;
      width: 220px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s, border-color 0.15s;
    }
    .identity-card:hover { transform: translateY(-4px); border-color: #b29be0; }
    .identity-card.elem-feu      { border-color: #D85A30; }
    .identity-card.elem-glace    { border-color: #378ADD; }
    .identity-card.elem-vide     { border-color: #7F77DD; }
    .identity-card .id-label     { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #888; margin-bottom: 8px; font-weight: 500; }
    .identity-card .id-title     { font-size: 15px; font-weight: 500; margin-bottom: 6px; color: #fff; }
    .identity-card .id-text      { font-size: 12px; color: #aaa; line-height: 1.5; }

    /* ── Carte Relique (écran de choix) ── */
    .relic-card {
      background: #252525; border: 2px solid #e8c97a;
      border-radius: 12px; padding: 16px; width: 220px;
      cursor: pointer; text-align: left;
      transition: transform 0.15s, border-color 0.15s;
    }
    .relic-card:hover { transform: translateY(-4px); border-color: #f0d060; }
    .relic-card.rarity-rare  { border-color: #d4a23d; box-shadow: 0 0 12px rgba(212,162,61,0.3); }
    .relic-card.rarity-epic  { border-color: #f0c040; box-shadow: 0 0 16px rgba(240,192,64,0.4); }
    .relic-card .relic-label { font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#e8c97a; margin-bottom:8px; font-weight:500; }
    .relic-card .relic-title { font-size:15px; font-weight:500; margin-bottom:6px; color:#fff; }
    .relic-card .relic-text  { font-size:12px; color:#aaa; line-height:1.5; }

    /* ── Bandeau Reliques (combat) ── */
    .relic-banner {
      background: #252525; border-radius: 8px; padding: 8px 14px;
      font-size: 12px; color: #aaa; line-height: 1.5;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      border-left: 3px solid #e8c97a;
    }
    .relic-banner.empty { opacity: 0.5; border-left-color: #555; }
    .relic-tag {
      background: #3d3020; border: 1px solid rgba(232,201,122,0.25);
      border-radius: 4px; padding: 2px 8px;
      color: #e8c97a; font-size: 11px; font-weight: 500;
    }

    /* ── Carte de choix de deck de départ ── */
    .deck-card {
      background: #252525;
      border-radius: 12px;
      padding: 20px;
      width: 240px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.15s, border-color 0.15s;
    }

    /* ── Carte signature (écran de choix) ── */
    .signature-card {
      background: #252525; border-radius: 12px; padding: 20px;
      width: 240px; cursor: pointer; text-align: left;
      transition: transform 0.15s, border-color 0.15s;
    }
    .signature-card:hover { transform: translateY(-4px); }

    .deck-card:hover { transform: translateY(-4px); }
  </style>
</head>
<body>

<div class="game" id="app"></div>

<script src="game-logic.js"></script>
<script>
// ============================================================
// ZONE 4 — RENDU (DOM)
// Ce fichier NE contient QUE des fonctions qui touchent le DOM
// (document.getElementById, confirm, alert, navigator.clipboard).
// Toute la donnée et la logique de jeu vivent dans game-logic.js,
// chargé juste au-dessus (même scope global, comportement identique
// à l'ancien fichier unique).
// ============================================================

// ── pickStarterDeck / render helpers (données) vivent dans game-logic.js ──

// ── renderDeckChoice ─────────────────────────────────────────────────────────
function renderDeckChoice() {
  const decksHTML = STARTER_DECKS.map((d, i) => {
    const c = d.composition;

    // Pills de composition — couleur par type d'élément/forme
    const pills = [
      c.feu   && `<span style="background:#5a2010;color:#f5a383;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:500;">🔥 Feu ×${c.feu}</span>`,
      c.glace && `<span style="background:#1e3a5f;color:#8bb8e8;border-radius:4px;padding:2px 7px;font-size:10px;font-weight:500;">❄ Glace ×${c.glace}</span>`,
      c.vide  && `<span style="background:#2c2845;color:#b29be0;border-radius:4px;padding:2px 7px;font-size:10px;">🕳 Vide ×${c.vide}</span>`,
      c.proj  && `<span style="background:#2a2a2a;color:#aaa;border-radius:4px;padding:2px 7px;font-size:10px;">→ Proj ×${c.proj}</span>`,
      c.zone  && `<span style="background:#2a2a2a;color:#aaa;border-radius:4px;padding:2px 7px;font-size:10px;">◎ Zone ×${c.zone}</span>`,
      c.arm   && `<span style="background:#2a2a2a;color:#aaa;border-radius:4px;padding:2px 7px;font-size:10px;">🛡 Arm ×${c.arm}</span>`,
    ].filter(Boolean).join('');

    return `
      <div class="deck-card" onclick="pickStarterDeck(${i})"
           style="border:2px solid ${d.accentColor};box-shadow:0 0 16px ${d.accentColor}33;">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;
                    color:${d.accentColor};margin-bottom:6px;font-weight:500;">${d.subtitle}</div>
        <div style="font-size:18px;font-weight:500;color:#fff;margin-bottom:10px;">${d.name}</div>
        <div style="font-size:12px;color:#aaa;line-height:1.5;margin-bottom:10px;">${d.description}</div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;">${pills}</div>
        <div style="font-size:11px;color:#5dd4a3;line-height:1.4;">💡 ${d.hint}</div>
        <div style="margin-top:16px;font-size:11px;color:#555;text-align:center;
                    border-top:1px solid #333;padding-top:10px;">→ Choisir ce deck</div>
      </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div style="padding:40px 20px;text-align:center;">
      <h2 style="font-size:22px;font-weight:500;margin-bottom:8px;">Choisir ton arsenal</h2>
      <p style="color:#aaa;font-size:13px;margin-bottom:32px;">
        Ton deck de départ définit ta stratégie naturelle. Il évoluera au fil des récompenses.
      </p>
      <div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;">
        ${decksHTML}
      </div>
    </div>`;
}

// ── renderMeta ──────────────────────────────────────────────────────────────
function renderMeta() {
  const meta = G.meta;
  const lastRun = G.lastRunResult;

  let headerHTML = `<h1 style="font-size:24px;font-weight:500;margin-bottom:8px;">Méta-progression</h1>`;

  if(lastRun) {
    const title = lastRun.won ? 'Run terminée — victoire' : 'Run terminée — défaite';
    const titleColor = lastRun.won ? '#5dd4a3' : '#f5a383';
    headerHTML += `
      <div style="background:#2a2a2a;border-radius:8px;padding:12px 16px;margin-bottom:16px;">
        <div style="color:${titleColor};font-weight:500;margin-bottom:4px;">${title}</div>
        <div style="font-size:13px;color:#aaa;">+${lastRun.fragmentsEarned} Fragments gagnés cette run.</div>
      </div>`;
  }

  const runLogHTML = (lastRun && G.run && G.run.runLog && G.run.runLog.length > 0) ? `
  <div style="background:#2a2a2a;border-radius:8px;padding:12px 16px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-weight:500;">Journal de la run</div>
      <button class="btn" onclick="copyRunLog()" style="font-size:12px;padding:4px 12px;">
        📋 Copier le journal
      </button>
    </div>
    <details>
      <summary style="font-size:12px;color:#888;cursor:pointer;">Aperçu (cliquer pour développer)</summary>
      <pre style="font-size:11px;color:#aaa;white-space:pre-wrap;margin-top:8px;max-height:300px;overflow-y:auto;background:#1a1a1a;padding:8px;border-radius:4px;">${G.run.runLog.join('\n')}</pre>
    </details>
  </div>
` : '';

  const statsHTML = `
    <div class="stats-row" style="margin-bottom:24px;">
      <div class="stat-box"><div class="stat-val" style="color:#e8c97a;">${meta.fragments}</div><div class="stat-lbl">Fragments</div></div>
      <div class="stat-box"><div class="stat-val">${meta.totalRunsWon}</div><div class="stat-lbl">Runs gagnées</div></div>
      <div class="stat-box"><div class="stat-val">${meta.totalRunsLost}</div><div class="stat-lbl">Runs perdues</div></div>
      <div class="stat-box"><div class="stat-val">${meta.unlockedCards.length}</div><div class="stat-lbl">Cartes débloquées</div></div>
    </div>`;

  const lockedCards = REWARD_POOL.filter(c => c.locked && !meta.unlockedCards.includes(c.id));
  const lockedHTML = lockedCards.length > 0 ? `
    <div style="margin-bottom:24px;">
      <div class="zone-label">Cartes à débloquer</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        ${lockedCards.map(c => {
          const canAfford = meta.fragments >= c.unlockCost;
          return `
            <div class="reward-card rarity-${c.rarity}" style="opacity:0.7;cursor:default;">
              <div class="rarity-label">${c.rarity}</div>
              <div class="card-name">🔒 ${c.name}</div>
              <div class="card-effect">${c.effect}</div>
              <button class="btn ${canAfford?'btn-primary':''}"
                      onclick="onUnlockCard('${c.id}')"
                      ${!canAfford?'disabled':''}
                      style="margin-top:12px;width:100%;font-size:12px;">
                Débloquer — ${c.unlockCost} Fragments
              </button>
            </div>`;
        }).join('')}
      </div>
    </div>` : '';

  const unlockedCards = REWARD_POOL.filter(c => c.locked && meta.unlockedCards.includes(c.id));
  const unlockedHTML = unlockedCards.length > 0 ? `
    <div style="margin-bottom:24px;">
      <div class="zone-label">Cartes débloquées</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        ${unlockedCards.map(c => `
          <div class="reward-card rarity-${c.rarity}" style="cursor:default;">
            <div class="rarity-label">${c.rarity}</div>
            <div class="card-name">✓ ${c.name}</div>
            <div class="card-effect">${c.effect}</div>
          </div>`).join('')}
      </div>
    </div>` : '';

  const launchHTML = `
    <div style="margin-top:32px;">
      <button class="btn btn-primary" onclick="onStartRun()" style="font-size:16px;padding:14px 24px;width:100%;">
        Lancer une nouvelle run →
      </button>
    </div>`;

  document.getElementById('app').innerHTML = `
    <div style="padding:20px 0;">
      ${headerHTML}
      ${runLogHTML}
      ${statsHTML}
      ${lockedHTML}
      ${unlockedHTML}
      ${launchHTML}
    </div>`;
}

// ── Cache de rendu des barres de PV ─────────────────────────────────────────
// Vit ici et PAS dans G : c'est une préoccupation d'affichage pure.
// Pourquoi : renderCombat réécrit tout l'innerHTML, donc chaque .hp-bar est un
// élément NEUF inséré directement à sa largeur finale. Une transition CSS a
// besoin d'une valeur de départ pour s'animer → `transition: width 0.3s`
// n'avait jamais joué une seule fois. On insère donc la barre à sa largeur
// précédente, puis on pose la vraie largeur à la frame suivante.
let hpBarCache = { enemiesRef: null, pcts: [] };

// ── renderCombat ────────────────────────────────────────────────────────────
function renderCombat() {
  const app = document.getElementById('app');

  // Nouveau combat = nouvelles barres, on repart de zéro (sinon la 1ʳᵉ frame
  // animerait depuis les PV de l'ennemi précédent).
  // On compare l'IDENTITÉ du tableau d'ennemis, pas encName : initCombat crée
  // un tableau neuf à chaque combat, y compris au Combat 1 d'une nouvelle run
  // (où encName serait identique et laisserait passer un cache périmé).
  if(hpBarCache.enemiesRef !== G.combat.enemies) {
    hpBarCache = { enemiesRef: G.combat.enemies, pcts: [] };
  }

  // ── BANDEAU IDENTITÉ ──
  const id = G.run.identity;
  const identityBannerHTML = id
    ? `<div class="identity-banner elem-${id.elem}">
         <span style="font-size:14px;">🜂</span>
         <span><span class="id-name">${id.name}</span> — <span class="id-desc">${id.description}</span></span>
       </div>`
    : `<div class="identity-banner empty">
         <span style="font-size:14px;">○</span>
         <span class="id-desc">Aucune identité — un choix sera proposé après les combats 2 et 4.</span>
       </div>`;

  // ── BANDEAU RELIQUES ──
  const relics = G.run.relics ?? [];
  const relicBannerHTML = relics.length > 0
    ? `<div class="relic-banner">
        <span style="font-size:14px;">⚙️</span>
        ${relics.map(r => `<span class="relic-tag">${r.name}</span>`).join('')}
      </div>`
    : `<div class="relic-banner empty">
        <span style="font-size:14px;">○</span>
        <span>Aucune relique — un choix sera proposé après le combat 4.</span>
      </div>`;

  // Bannière Cataclysme actif
  const comboBonusHTML = G.combat.comboBonusTurn > 0
  ? `<div class="combo-bonus-banner">
      🌋 Cataclysme actif — combos +${G.combat.comboBonusTurn} dgt (${G.combat.comboBonusTurnsLeft} tour${G.combat.comboBonusTurnsLeft>1?'s':''})
    </div>`
  : '';

  let enemyHTML = G.combat.enemies.map((e, i) => {
    const pct = Math.round((e.hp / e.maxHp) * 100);
    // Largeur de départ de l'animation = ce qui était affiché au render précédent.
    const fromPct = hpBarCache.pcts[i] ?? pct;
    hpBarCache.pcts[i] = pct;
    let states = '';
    if(e.givre > 0)   states += `<span class="state-badge state-givre">❄ Givré ${e.givre}</span>`;
    if(e.brule > 0)   states += `<span class="state-badge state-brule">🔥 Brûlure ${e.brule}${e.bruleLocked ? ' 🔒' : ''}</span>`;
    if(e.fragile > 0) states += `<span class="state-badge state-frag">💎 Fragile ${e.fragile}</span>`;
    if(e.stun)        states += `<span class="state-badge state-stun">Stunné</span>`;

    const totalAtk = e.atk + (e.atkBonus || 0);
    const atkDisplay = e.atkBonus > 0
      ? `Attaque : ${totalAtk} dgt/tour <span style="color:#f5a383">(+${e.atkBonus})</span>`
      : `Attaque : ${totalAtk} dgt/tour`;

    const shieldDisplay = e.enemyShield > 0
      ? `<div style="font-size:12px;color:#8bb8e8;margin-bottom:4px;">🛡️ Bouclier : ${e.enemyShield}</div>`
      : '';

    const intentDisplay = e.intent
      ? `<div style="font-size:12px;color:#f5a383;font-weight:500;margin-top:4px;">⚠️ Prépare : ${e.intent.damage} dgt !</div>`
      : '';

    const archetypeHint = e.archetypeHint
      ? `<div style="font-size:10px;color:#e8c97a;margin-top:3px;">⚡ ${e.archetypeHint}</div>`
      : '';

    return `<div class="enemy-card ${e.hp<=0?'dead':''}">
      <div class="enemy-name">${e.name}</div>
      <div class="enemy-atk">${atkDisplay}</div>
      ${archetypeHint}
      ${shieldDisplay}
      <div class="hp-bar-wrap"><div class="hp-bar" data-enemy-idx="${i}" style="width:${fromPct}%"></div></div>
      <div class="hp-text">${e.hp} / ${e.maxHp} PV</div>
      ${intentDisplay}
      <div class="states-row">${states}</div>
    </div>`;
  }).join('');

  let handHTML = G.combat.hand.map(c => {
    const sel = G.selected.includes(c.id);
    const typeLabel = c.type === 'element' ? 'Élément' :
                      c.type === 'forme'   ? 'Forme'   : 'Consumable';
    return `<div class="card ${c.type} ${sel?'selected':''}" onclick="selectCard('${c.id}')">
      <div class="card-type">${typeLabel}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-cost">${c.cost} mana</div>
      <div class="card-effect">${c.effect}</div>
    </div>`;
  }).join('');

  if(G.combat.hand.length === 0)
    handHTML = `<div style="font-size:13px;color:#888;padding:8px;">Main vide — fin de tour ?</div>`;

  let targetHTML = '';
  if(needsTargetChoice()) {
    const living = G.combat.enemies.map((e,i)=>({e,i})).filter(o=>o.e.hp>0);
    targetHTML = `<div class="target-row">
      <div style="font-size:12px;color:#aaa;align-self:center">Cible :</div>
      ${living.map(o=>`<button class="target-btn ${G.selectedTarget===o.i?'selected':''}" onclick="selectTarget(${o.i})">${o.e.name}</button>`).join('')}
    </div>`;
  }

  const logHTML = G.log.slice(0,18).map(l=>`<div class="log-entry ${l.type}">${l.msg}</div>`).join('');

  const t = selectionType();
  const buttonLabel  = t === 'consumable' ? 'Jouer la carte' : 'Assembler';
  const buttonAction = t === 'consumable' ? 'playConsumable()' : 'assembleAction()';

  app.innerHTML = `
    <div class="synergies-banner">
      <b>Synergies :</b>
      Glace → Givré <span class="arrow">→</span> Feu x2 (Choc thermique).
      Feu → Brûlure <span class="arrow">→</span> Vide détonne (+2/stack).
      Vide → Fragile <span class="arrow">→</span> Glace stunne (Fracture).
      <b>Élan</b> = +1 action +1 mana ce tour.
    </div>

    ${identityBannerHTML}
    ${relicBannerHTML}

    <div>
      <div class="zone-label">${G.encName}</div>
      <div class="enemies-row">${enemyHTML}</div>
    </div>

    <hr class="divider">

    <div>
      <div class="zone-label">Ton état</div>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-val">${G.playerHp}<span style="font-size:13px;color:#666">/${G.playerMaxHp}</span></div><div class="stat-lbl">PV</div></div>
        <div class="stat-box"><div class="stat-val">${G.shield}</div><div class="stat-lbl">Bouclier</div></div>
        <div class="stat-box"><div class="stat-val">${G.mana}<span style="font-size:13px;color:#666">/${G.maxMana}</span></div><div class="stat-lbl">Mana</div></div>
        <div class="stat-box"><div class="stat-val">${G.actionsLeft}</div><div class="stat-lbl">Actions</div></div>
      </div>
      ${comboBonusHTML}
    </div>

    <hr class="divider">

    <div>
      <div class="zone-label">Ta main (${G.combat.hand.length} cartes — pioche ${G.combat.deck.length}, défausse ${G.combat.discard.length})</div>
      <div class="hand-row">${handHTML}</div>
    </div>

    <div>
      <div class="zone-label">Zone d'assemblage</div>
      <div class="assembly-zone">
        <div class="assembly-preview">${assemblyDescription()}</div>
      </div>
      ${targetHTML}
    </div>

    <div class="actions-row">
      <button class="btn btn-primary" onclick="${buttonAction}" ${!canPlay()?'disabled':''}>${buttonLabel}</button>
      <button class="btn" onclick="discardCard()" ${!canDiscard()?'disabled':''}>Défausser</button>
      <button class="btn" onclick="endTurn()">Fin de tour →</button>
      <button class="btn" onclick="abandonRun()" style="margin-left:auto;font-size:12px;">Abandonner la run</button>
    </div>

    <hr class="divider">

    <div>
      <div class="zone-label">Journal de combat</div>
      <div class="log">${logHTML}</div>
    </div>`;

  // Frame suivante : on pose la largeur réelle → la transition CSS s'anime.
  // Garde sur `bar` : un autre render a pu remplacer le DOM entre-temps.
  requestAnimationFrame(() => {
    G.combat.enemies.forEach((e, i) => {
      const bar = app.querySelector(`.hp-bar[data-enemy-idx="${i}"]`);
      if(bar) bar.style.width = `${hpBarCache.pcts[i]}%`;
    });
  });
}

function renderSignatureChoice() {
  const sig    = G.signatureChoice;
  const deck   = STARTER_DECKS.find(d => d.id === sig.deckId);
  const accent = deck?.accentColor ?? '#e8c97a';

  document.getElementById('app').innerHTML = `
    <div style="padding:40px 20px;text-align:center;">
      <h2 style="margin-bottom:8px;">⚜️ Ta carte signature</h2>
      <p style="color:#aaa;font-size:13px;margin-bottom:24px;">
        Exclusive au deck <b>${deck?.name}</b> — elle incarne ta win condition. Aucun autre deck ne la verra.
      </p>
      <div style="display:flex;justify-content:center;margin-bottom:24px;">
        <div class="signature-card" onclick="pickSignature()"
             style="border:2px solid ${accent};box-shadow:0 0 20px ${accent}55;">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:${accent};margin-bottom:8px;font-weight:500;">Signature — ${deck?.name}</div>
          <div style="font-size:17px;font-weight:500;color:#fff;margin-bottom:6px;">${sig.name}</div>
          <div style="font-size:12px;color:#aaa;margin-bottom:8px;">${sig.cost} mana</div>
          <div style="font-size:12px;color:#aaa;line-height:1.5;">${sig.effect}</div>
          <div style="margin-top:16px;font-size:11px;color:#555;border-top:1px solid #333;padding-top:10px;">→ Ajouter à ton deck</div>
        </div>
      </div>
      <button class="btn" onclick="skipSignature()">Passer (ne pas prendre)</button>
    </div>`;
}

// ── renderReward ────────────────────────────────────────────────────────────
function renderReward() {
  const cardsHTML = G.rewardChoices.map((c, i) => {
    const costDisplay = c.cost === null ? 'Effet permanent' : `${c.cost} mana`;
    return `<div class="reward-card rarity-${c.rarity}" onclick="pickReward(${i})">
      <div class="rarity-label">${c.rarity}</div>
      <div class="card-name">${c.name}</div>
      <div class="card-cost">${costDisplay}</div>
      <div class="card-effect">${c.effect}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div style="padding: 40px 20px; text-align: center;">
      <h2 style="margin-bottom: 24px;">Choisis une carte récompense</h2>
      <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px;">
        ${cardsHTML}
      </div>
      <button class="btn" onclick="skipReward()">Passer (ne rien prendre)</button>
    </div>`;
}

function renderIdentityChoice() {
  const choices = G.identityChoices;
  const current = G.run.identity;

  // Intro adaptée au deck (Piste B) — explique POURQUOI le pool est filtré
  const starterDeck = STARTER_DECKS.find(d => d.id === G.run.startingDeckId);
  const isExpert    = (starterDeck?.excludeIdentities ?? []).length === 0;
  const introText   = isExpert
    ? `Ton arsenal est polyvalent — <b>toutes les voies</b> te sont ouvertes.`
    : `Ton deck <b>${starterDeck?.name}</b> incarne déjà sa voie élémentaire. Choisis une voie <b>complémentaire</b> pour façonner un build hybride.`;

  const currentHTML = current ? `
    <div style="background:#2a2a2a;border-radius:8px;padding:12px 16px;margin-bottom:24px;">
      <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;">Identité actuelle</div>
      <div style="font-weight:500;color:#fff;margin-bottom:4px;">${current.name}</div>
      <div style="font-size:13px;color:#aaa;">${current.description}</div>
      <div style="font-size:12px;color:#e8c97a;margin-top:8px;">⚠️ Choisir une nouvelle identité remplacera l'actuelle.</div>
    </div>
  ` : '';

  const cardsHTML = choices.map((c, i) => {
    const buttonLabel = current ? 'Remplacer' : 'Choisir';
    return `<div class="identity-card elem-${c.elem}" onclick="pickIdentity(${i})">
      <div class="id-label">Identité — ${c.elem}</div>
      <div class="id-title">${c.name}</div>
      <div class="id-text">${c.description}</div>
      <div style="margin-top:12px;font-size:11px;color:#888;text-align:center;">→ ${buttonLabel}</div>
    </div>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div style="padding:40px 20px;text-align:center;">
      <h2 style="margin-bottom:8px;">Une identité s'éveille</h2>
      <p style="color:#aaa;font-size:13px;margin-bottom:24px;">${introText}</p>
      ${currentHTML}
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">
        ${cardsHTML}
      </div>
      <button class="btn" onclick="skipIdentity()">Passer (garder l'identité actuelle)</button>
    </div>
  `;
}

function renderRelicChoice() {
  const choices = G.relicChoices;
  const owned   = G.run.relics ?? [];

  const ownedHTML = owned.length > 0 ? `
    <div style="background:#2a2a2a;border-radius:8px;padding:12px 16px;margin-bottom:24px;">
      <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">Reliques actives</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${owned.map(r => `<span class="relic-tag">⚙️ ${r.name}</span>`).join('')}
      </div>
    </div>` : '';

  const cardsHTML = choices.map((r, i) => `
    <div class="relic-card rarity-${r.rarity ?? 'common'}" onclick="pickRelic(${i})">
      <div class="relic-label">Relique</div>
      <div class="relic-title">${r.name}</div>
      <div class="relic-text">${r.description}</div>
      <div style="margin-top:12px;font-size:11px;color:#888;text-align:center;">→ Équiper</div>
    </div>`).join('');

  document.getElementById('app').innerHTML = `
    <div style="padding:40px 20px;text-align:center;">
      <h2 style="margin-bottom:8px;">⚙️ Une relique s'offre à toi</h2>
      <p style="color:#aaa;font-size:13px;margin-bottom:24px;">
        Une relique modifie structurellement ta run. Elle reste active jusqu'à la fin.
      </p>
      ${ownedHTML}
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">
        ${cardsHTML}
      </div>
      <button class="btn" onclick="skipRelic()">Passer (ne rien prendre)</button>
    </div>`;
}

function render() {
  switch(G.scene) {
    case 'deckChoice':     renderDeckChoice(); break;
    case 'combat':  renderCombat(); break;
    case 'signatureChoice': renderSignatureChoice(); break;
    case 'reward':  renderReward(); break;
    case 'identityChoice': renderIdentityChoice(); break;
    case 'meta':    renderMeta();   break;
    case 'relicChoice': renderRelicChoice(); break;
  }
}
// Branche le point d'extension de game-logic.js sur le vrai rendu DOM.
// game-logic.js ne connaît que requestRender() — jamais render() directement.
requestRender = render;

// ============================================================
// ZONE 5 — ÉVÉNEMENTS UTILISATEUR (DOM uniquement)
// selectCard/selectTarget/discardCard/playConsumable vivent dans
// game-logic.js (zéro dépendance DOM). Ici : uniquement ce qui
// touche confirm()/alert()/clipboard/document.
// ============================================================

function abandonRun() {
  if(!confirm('Abandonner cette run ? Tes Fragments accumulés seront conservés.')) return;
  commitRunRewards(false);
  transitionTo('meta');
}

function copyRunLog() {
  if(!G.run || !G.run.runLog) return;
  const text = G.run.runLog.join('\n');
  navigator.clipboard.writeText(text).then(
    () => alert('Journal copié dans le presse-papier.'),
    () => {
      // Fallback : afficher dans une textarea sélectionnable
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:80%;height:60%;z-index:9999;';
      document.body.appendChild(ta);
      ta.select();
      alert('Sélection prête — fais Ctrl+C, puis ferme la fenêtre.');
      ta.addEventListener('blur', () => ta.remove());
    }
  );
}

// ============================================================
// DÉMARRAGE
// ============================================================

G.meta = loadMeta();

window.resetMeta     = resetMeta;
window.unlockCard    = unlockCard;
window.giveFragments = (n) => { G.meta.fragments += n; saveMeta(); console.log(`+${n} Fragments. Total : ${G.meta.fragments}`); };
window.showMeta      = () => console.log(JSON.parse(JSON.stringify(G.meta)));
window.pickIdentity = pickIdentity;
window.skipIdentity = skipIdentity;
window.giveRelic = (id) => {
  const r = RELIC_POOL.find(x => x.id === id);
  if (r) { G.run.relics.push({ ...r, baseId: r.id }); render(); console.log(`+${r.name}`); }
};
window.giveIdentity = (id) => {
  const i = IDENTITY_POOL.find(x => x.id === id);
  if (i) { G.run.identity = { ...i, baseId: i.id }; render(); console.log(`Identité : ${i.name}`); }
};

if(DEV.startCombat > 0) {
  initRun();
  // En mode DEV, on bypass le choix de deck → Arsenal par défaut
  G.run.deck = shuffle(CARDS_DEF.map(c => ({...c})));
  G.run.startingDeckId = 'arsenal';
  G.run.combatIndex = DEV.startCombat;
  initCombat(DEV.startCombat);
} else {
  G.scene = 'meta';
  G.lastRunResult = null;
  render();
}
</script>

</body>
</html>
